<style type="text/tailwindcss">
  @custom-variant dark (&:where(.dark, .dark *));
  @theme {
    --color-zinc-50:#f5f7fa; --color-zinc-100:#eef1f6; --color-zinc-200:#e0e5ee; --color-zinc-300:#cbd3e1;
    --color-zinc-400:#93a0b5; --color-zinc-500:#64718a; --color-zinc-600:#475066; --color-zinc-700:#353d50;
    --color-zinc-800:#222838; --color-zinc-900:#161b28; --color-zinc-950:#0d1119;
  }
  body{font-family:'Geist',system-ui,sans-serif}
  .serif{font-family:'Instrument Serif','Spectral',Georgia,serif;font-weight:400}
  .mono{font-family:'Geist Mono',ui-monospace,monospace}
  .prose{line-height:1.78;font-size:.98rem}
  .prose>*:first-child{margin-top:0}
  .prose h1{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:2.15rem;letter-spacing:-.01em;line-height:1.15;margin:0 0 1.1rem}
  .prose h2{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:1.55rem;margin:2.4rem 0 .7rem;padding-top:1.2rem;border-top:1px solid rgba(148,163,184,.15)}
  .prose h3{font-weight:600;font-size:1.1rem;margin:1.8rem 0 .5rem}
  .prose p{margin:.7rem 0}
  .prose a{color:#0891b2;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px}
  .dark .prose a{color:#22d3ee}
  .prose ul,.prose ol{margin:.7rem 0 .7rem 1.4rem}
  .prose ul{list-style:disc}.prose ol{list-style:decimal}
  .prose li{margin:.3rem 0}
  .prose blockquote{border-left:3px solid rgba(34,211,238,.5);padding:.1rem 0 .1rem 1rem;color:#64718a;margin:1rem 0}
  .dark .prose blockquote{color:#93a0b5}
  .prose code{font-family:'Geist Mono',monospace;font-size:.85em;background:rgba(100,116,139,.12);border-radius:.3rem;padding:.12em .38em}
  .dark .prose code{background:rgba(148,163,184,.13)}
  .prose pre{background:#0d1119;color:#e0e5ee;border:1px solid #222838;border-radius:.8rem;padding:1rem 1.15rem;overflow-x:auto;margin:1rem 0}
  .prose pre code{background:none;padding:0;font-size:.84rem}
  .prose table{border-collapse:collapse;margin:1.1rem 0;width:100%;font-size:.9rem;display:block;overflow-x:auto}
  .prose th,.prose td{border:1px solid #cbd3e1;padding:.5rem .75rem;text-align:left;vertical-align:top}
  .dark .prose th,.dark .prose td{border-color:#353d50}
  .prose th{background:rgba(100,116,139,.08);font-weight:600}
  .prose img{max-width:100%;border-radius:.7rem}
  .prose hr{border:none;border-top:1px solid #cbd3e1;margin:1.8rem 0}
  .dark .prose hr{border-top-color:#353d50}
  .prose .mermaid{background:transparent;display:flex;justify-content:center;margin:1.2rem 0;overflow-x:auto}
</style>
</head>
<body class="min-h-screen bg-[#f6f8fc] text-zinc-900 antialiased dark:bg-[#0a0e1a] dark:text-zinc-100">

<header class="sticky top-0 z-20 border-b border-zinc-200 bg-[#f6f8fc]/90 backdrop-blur dark:border-zinc-800 dark:bg-[#0a0e1a]/90">
  <div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-3">
    <div class="flex items-baseline gap-3">
      <a href="/" class="serif text-xl leading-none tracking-tight">Lethe</a>
      <span class="mono text-[10px] uppercase tracking-[0.22em] text-zinc-400">docs</span>
    </div>
    <div class="flex items-center gap-2">
      <button id="theme" aria-label="Toggle theme" class="grid h-8 w-8 place-items-center rounded-md border border-zinc-300 text-zinc-600 transition hover:bg-zinc-100 dark:border-zinc-800 dark:text-zinc-400 dark:hover:bg-zinc-900">
        <svg class="block dark:hidden" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="hidden dark:block" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/></svg>
      </button>
      <a href="https://github.com/vinayaksonthalia/lethe" target="_blank" rel="noopener" aria-label="GitHub repository" class="grid h-8 w-8 place-items-center rounded-md border border-zinc-300 text-zinc-600 transition hover:bg-zinc-100 dark:border-zinc-800 dark:text-zinc-400 dark:hover:bg-zinc-900">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 .5C5.7.5.7 5.6.7 11.9c0 5 3.2 9.3 7.7 10.8.6.1.8-.2.8-.5v-2c-3.1.7-3.8-1.3-3.8-1.3-.5-1.3-1.2-1.7-1.2-1.7-1-.7.1-.7.1-.7 1.1.1 1.7 1.2 1.7 1.2 1 1.7 2.6 1.2 3.2.9.1-.7.4-1.2.7-1.5-2.5-.3-5.1-1.3-5.1-5.7 0-1.2.4-2.2 1.2-3-.1-.3-.5-1.5.1-3 0 0 .9-.3 3.1 1.2a10.7 10.7 0 0 1 5.6 0c2.2-1.5 3.1-1.2 3.1-1.2.6 1.5.2 2.7.1 3 .7.8 1.2 1.8 1.2 3 0 4.4-2.6 5.4-5.1 5.7.4.4.8 1.1.8 2.2v3.2c0 .3.2.6.8.5 4.5-1.5 7.7-5.8 7.7-10.8C23.3 5.6 18.3.5 12 .5z"/></svg>
      </a>
      <a href="/app" class="rounded-full bg-zinc-950 px-4 py-1.5 text-sm font-medium text-white transition hover:bg-zinc-800 dark:bg-white dark:text-black dark:hover:bg-zinc-200">Launch app</a>
    </div>
  </div>
</header>

<div class="mx-auto flex max-w-6xl gap-10 px-5 py-8">
  <nav id="side" class="hidden w-64 shrink-0 md:block">
    <div class="sticky top-20 max-h-[calc(100vh-6rem)] overflow-y-auto pr-3">
      <div id="toc" class="space-y-5 text-sm"></div>
    </div>
  </nav>
  <main class="min-w-0 flex-1">
    <div class="mb-4 md:hidden">
      <select id="mobileNav" aria-label="Choose a chapter" class="w-full rounded-lg border border-zinc-300 bg-white px-3 py-2 text-sm dark:border-zinc-800 dark:bg-[#141b2b]"></select>
    </div>
    <p id="crumb" class="mono mb-2 text-[10px] uppercase tracking-[0.22em] text-cyan-600 dark:text-cyan-400"></p>
    <article id="doc" class="prose max-w-3xl"><p class="text-zinc-400">loading…</p></article>
    <div id="pager" class="mt-12 flex max-w-3xl items-stretch justify-between gap-3"></div>
    <div class="mt-8 max-w-3xl border-t border-zinc-200 pt-4 text-xs text-zinc-400 dark:border-zinc-800">
      Written alongside the build and verified against the running app — the same chapters live in <a class="underline decoration-dotted underline-offset-2" href="https://github.com/vinayaksonthalia/lethe/tree/main/learning" target="_blank" rel="noopener">learning/</a> in the repo.
    </div>
  </main>
</div>

<script>
 const root=document.documentElement;
 if(localStorage.theme==='light')root.classList.remove('dark');
 document.getElementById('theme').onclick=()=>{root.classList.toggle('dark');localStorage.theme=root.classList.contains('dark')?'dark':'light';renderMermaid();};

 mermaid.initialize({startOnLoad:false,securityLevel:'loose',theme:root.classList.contains('dark')?'dark':'neutral'});
 marked.setOptions({gfm:true,breaks:false});

 const DEFAULT_DOC='00-the-big-picture/what-is-this.md';
 let SECTIONS=[],FLAT=[];
 const meta=p=>FLAT.find(d=>d.path===p);
 function currentPath(){const h=decodeURIComponent(location.hash.replace(/^#/,''));return h||DEFAULT_DOC;}

 async function loadIndex(){
   const j=await(await fetch('/learn/index.json')).json();SECTIONS=j.sections||[];
   FLAT=[];SECTIONS.forEach(s=>s.items.forEach(it=>FLAT.push({...it,section:s.label})));
   const toc=document.getElementById('toc');toc.innerHTML='';
   const mob=document.getElementById('mobileNav');mob.innerHTML='';
   SECTIONS.forEach(s=>{
     const box=document.createElement('div');
     box.innerHTML='<p class="mono mb-1.5 text-[10px] uppercase tracking-[0.18em] text-zinc-400">'+s.label+'</p>';
     const ul=document.createElement('ul');ul.className='space-y-0.5 border-l border-zinc-200 dark:border-zinc-800';
     s.items.forEach(d=>{
       const li=document.createElement('li');
       const a=document.createElement('a');
       a.href='#'+d.path;a.dataset.path=d.path;
       a.className='-ml-px block border-l-2 border-transparent py-1 pl-3 text-[13px] leading-snug text-zinc-500 transition hover:border-zinc-400 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100';
       a.textContent=d.title;
       li.appendChild(a);ul.appendChild(li);
     });
     box.appendChild(ul);toc.appendChild(box);
     const og=document.createElement('optgroup');og.label=s.label;
     s.items.forEach(d=>{const o=document.createElement('option');o.value=d.path;o.textContent=d.title;og.appendChild(o);});
     mob.appendChild(og);
   });
   mob.onchange=()=>{location.hash=mob.value;};
   markActive();
 }

 function markActive(){
   const cur=currentPath();
   document.querySelectorAll('#toc a').forEach(a=>{
     const on=a.dataset.path===cur;
     a.classList.toggle('border-cyan-500',on);a.classList.toggle('text-cyan-700',on);
     a.classList.toggle('dark:text-cyan-300',on);a.classList.toggle('font-medium',on);
     if(on)a.classList.remove('border-transparent');else a.classList.add('border-transparent');
   });
   const mob=document.getElementById('mobileNav');if(mob&&mob.value!==cur)mob.value=cur;
 }

 function renderMermaid(){
   mermaid.initialize({startOnLoad:false,securityLevel:'loose',theme:root.classList.contains('dark')?'dark':'neutral'});
   document.querySelectorAll('#doc pre code.language-mermaid').forEach(code=>{
     const holder=document.createElement('div');holder.className='mermaid';holder.textContent=code.textContent;
     code.closest('pre').replaceWith(holder);
   });
   try{mermaid.run({querySelector:'#doc .mermaid'});}catch(e){}
 }

 function renderPager(p){
   const i=FLAT.findIndex(d=>d.path===p);
   const box=document.getElementById('pager');box.innerHTML='';
   const mk=(d,side)=>{
     const a=document.createElement('a');a.href='#'+d.path;
     a.className='group flex-1 rounded-xl border border-zinc-200 p-3.5 transition hover:border-cyan-500/50 dark:border-zinc-800 '+(side==='next'?'text-right':'');
     a.innerHTML='<p class="mono text-[10px] uppercase tracking-wider text-zinc-400">'+(side==='next'?'Next':'Previous')+'</p>'+
       '<p class="mt-0.5 text-sm font-medium text-zinc-700 transition group-hover:text-cyan-700 dark:text-zinc-200 dark:group-hover:text-cyan-300">'+d.title+'</p>';
     return a;
   };
   if(i>0)box.appendChild(mk(FLAT[i-1],'prev'));else box.appendChild(document.createElement('span'));
   if(i>=0&&i<FLAT.length-1)box.appendChild(mk(FLAT[i+1],'next'));
 }

 async function loadDoc(){
   const p=currentPath();
   const el=document.getElementById('doc');
   el.innerHTML='<p class="text-zinc-400">loading…</p>';
   try{
     const r=await fetch('/learn/raw/'+p.split('/').map(encodeURIComponent).join('/'));
     if(!r.ok){el.innerHTML='<p class="text-zinc-400">Chapter not found. Pick one from the list.</p>';return;}
     el.innerHTML=marked.parse(await r.text());
     el.querySelectorAll('a[href]').forEach(a=>{
       const href=a.getAttribute('href')||'';
       if(/^https?:/i.test(href))a.setAttribute('target','_blank');
       else if(href.indexOf('.md')!==-1){
         const base=p.split('/').slice(0,-1);
         href.replace(/^\.\//,'').split('/').forEach(seg=>{if(seg==='..')base.pop();else if(seg!=='.')base.push(seg);});
         a.setAttribute('href','#'+base.join('/').split('#')[0]);
       }
     });
     const m=meta(p);
     document.getElementById('crumb').textContent=m?m.section:'';
     document.title=(m?m.title+' — ':'')+'Lethe Docs';
     renderPager(p);renderMermaid();window.scrollTo(0,0);markActive();
   }catch(e){el.innerHTML='<p class="text-zinc-400">Could not load this chapter.</p>';}
 }

 window.addEventListener('hashchange',loadDoc);
 loadIndex().then(loadDoc);
</script>
</body></html>
