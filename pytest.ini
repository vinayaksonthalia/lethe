[pytest]
# Repo root on sys.path so tests can `import app` / `import incident_brain`.
pythonpath = . tests
testpaths = tests
# Default run = the no-key, fully-hermetic tier. The live end-to-end test (which does
# real cognee/LLM work + grabs the kuzu lock) is opt-in only: RUN_LIVE=1 pytest -m live
addopts = -m "not live"
markers =
    live: opt-in end-to-end test against real cognee (needs RUN_LIVE=1 + the :8077 server stopped)
filterwarnings =
    ignore::DeprecationWarning
